name: 기능 개발
description: 명세·화면·계약·수용 기준을 연결하는 개발 작업
title: '[기능] '
body:
  - type: textarea
    id: scope
    attributes:
      label: 문제와 범위
      description: 해당 기능 명세 절, 사용자 역할과 단계를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 화면·API·도메인 계약
      description: 필드 출처, 권한, 상태 전이와 revision 영향을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 성공·실패·권한·기관 경계에서 확인할 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 검증 결과와 남은 가정
      description: 실행한 검사만 결과를 적고 MOCK·LIVE_UNVERIFIED를 구분하세요.
